<path d="M760,360 L778,360" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<rect x="330" y="330" width="230" height="60" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="445.0" y="356.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111827">soft: cos(phase change)</text>
<text x="445.0" y="371.5" font-size="9.0" text-anchor="middle" fill="#374151">for the display only</text>
<path d="M520,280 L520,310 L445,310 L445,328" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<rect x="990" y="300" width="170" height="90" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="1075.0" y="326.5" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">Nav decoder (EPB)</text>
<text x="1075.0" y="341.5" font-size="9.5" text-anchor="middle" fill="#374151">parity, frame sync,</text>
<text x="1075.0" y="356.5" font-size="9.5" text-anchor="middle" fill="#374151">TOW, subframe ID,</text>
<text x="1075.0" y="371.5" font-size="9.5" text-anchor="middle" fill="#374151">week -&gt; UTC</text>
<path d="M940,360 L988,345" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<text x="944" y="338" font-size="10.5" fill="#374151">bits + tags</text>
<rect x="990" y="110" width="170" height="140" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="1075.0" y="146.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111827">Why differential?</text>
<text x="1075.0" y="161.5" font-size="9.0" text-anchor="middle" fill="#374151">The FLL locks frequency,</text>
<text x="1075.0" y="176.5" font-size="9.0" text-anchor="middle" fill="#374151">not phase, so P slowly</text>
<text x="1075.0" y="191.5" font-size="9.0" text-anchor="middle" fill="#374151">rotates. Comparing a bit</text>
<text x="1075.0" y="206.5" font-size="9.0" text-anchor="middle" fill="#374151">with the previous one</text>
<text x="1075.0" y="221.5" font-size="9.0" text-anchor="middle" fill="#374151">ignores that rotation.</text>
<path d="M150,190 L173,190" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
