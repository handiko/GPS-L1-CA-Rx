<text x="770.0" y="246.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111827">Binary</text>
<text x="770.0" y="261.5" font-size="9.0" text-anchor="middle" fill="#374151">Slicer</text>
<rect x="840" y="220" width="100" height="60" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="890.0" y="246.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111827">Diff</text>
<text x="890.0" y="261.5" font-size="9.0" text-anchor="middle" fill="#374151">Encoder (mod 2)</text>
