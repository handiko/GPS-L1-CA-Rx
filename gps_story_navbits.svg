<text x="235.0" y="201.5" font-size="9.5" text-anchor="middle" fill="#374151">length 20 (sum)</text>
<text x="330" y="95" font-size="11.5" fill="#059669" text-anchor="start" font-weight="bold">bit sync: where are the 20 ms bit edges?</text>
