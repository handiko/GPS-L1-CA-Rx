<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="DejaVu Sans, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1180" height="640" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#111827">The whole lab on one page: gps_l1_lab.grc</text>
<rect x="470" y="41" width="16" height="11" fill="#eef2ff" stroke="#4f46e5"/>
<text x="492" y="50" font-size="11.0" fill="#374151" text-anchor="start">stock GNU Radio block</text>
<rect x="647" y="41" width="16" height="11" fill="#ecfdf5" stroke="#059669"/>
<text x="669" y="50" font-size="11.0" fill="#374151" text-anchor="start">hier block (stock inside)</text>
<rect x="852" y="41" width="16" height="11" fill="#fef2f2" stroke="#dc2626"/>
<text x="874" y="50" font-size="11.0" fill="#374151" text-anchor="start">Embedded Python Block</text>
<rect x="1029" y="41" width="16" height="11" fill="#f8fafc" stroke="#64748b"/>
<text x="1051" y="50" font-size="11.0" fill="#374151" text-anchor="start">QT GUI display</text>
<rect x="20" y="90" width="130" height="64" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="85.0" y="111.0" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">RTL-SDR source</text>
<text x="85.0" y="126.0" font-size="10.0" text-anchor="middle" fill="#374151">1575.42 MHz</text>
<text x="85.0" y="141.0" font-size="10.0" text-anchor="middle" fill="#374151">2.048 MS/s, bias=1</text>
<rect x="180" y="90" width="110" height="64" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="235.0" y="118.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">DC Blocker</text>
<text x="235.0" y="133.5" font-size="10.0" text-anchor="middle" fill="#374151">kills the LO spike</text>
<rect x="320" y="90" width="110" height="64" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="375.0" y="118.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">AGC</text>
<text x="375.0" y="133.5" font-size="10.0" text-anchor="middle" fill="#374151">noise rms -&gt; 1</text>
<path d="M150,122 L178,122" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M290,122 L318,122" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<rect x="470" y="62" width="690" height="218" rx="10" fill="#ffffff" fill-opacity="0.45" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="480" y="80" font-size="12" font-weight="bold" fill="#94a3b8">ACQUISITION: which satellites, at what code phase and Doppler?</text>
<rect x="490" y="90" width="150" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="565.0" y="114.0" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">Taps scheduler</text>
<text x="565.0" y="129.0" font-size="10.0" text-anchor="middle" fill="#374151">which PRN / Doppler</text>
<text x="565.0" y="144.0" font-size="10.0" text-anchor="middle" fill="#374151">per 20 ms, tagged</text>
<rect x="680" y="90" width="170" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="765.0" y="116.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">gps_acq_branch</text>
<text x="765.0" y="131.5" font-size="10.0" text-anchor="middle" fill="#374151">whole-kHz Doppler bins</text>
<rect x="680" y="170" width="170" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="765.0" y="196.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">gps_acq_branch</text>
<text x="765.0" y="211.5" font-size="10.0" text-anchor="middle" fill="#374151">half-kHz bins (-500 Hz)</text>
<rect x="900" y="120" width="140" height="76" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="970.0" y="147.0" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">Decider</text>
<text x="970.0" y="162.0" font-size="10.0" text-anchor="middle" fill="#374151">peak/mean, dof test</text>
<text x="970.0" y="177.0" font-size="10.0" text-anchor="middle" fill="#374151">assigns a channel</text>
<rect x="1060" y="100" width="86" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
<text x="1103.0" y="121.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111827">Search</text>
<text x="1103.0" y="136.5" font-size="9.0" text-anchor="middle" fill="#374151">plots</text>
<rect x="1060" y="170" width="86" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
<text x="1103.0" y="191.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111827">Probes</text>
<text x="1103.0" y="206.5" font-size="9.0" text-anchor="middle" fill="#374151">1 ms / 20 ms</text>
<path d="M430,122 L488,122" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M450,122 L450,250 L665,250 L665,120 L678,120" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M665,200 L678,200" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M640,125 L660,125 L660,140 L678,140" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<text x="642" y="112" font-size="10.5" fill="#374151">taps</text>
<path d="M660,140 L660,215 L678,215" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M850,120 L875,120 L875,150 L898,150" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M850,200 L875,200 L875,170 L898,170" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M1040,135 L1058,128" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#m)"/>
<path d="M850,205 L1058,205" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<rect x="470" y="300" width="690" height="150" rx="10" fill="#ffffff" fill-opacity="0.45" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="480" y="318" font-size="12" font-weight="bold" fill="#94a3b8">TRACKING: keep a code replica aligned, every 1 ms (x4 channels)</text>
<rect x="490" y="335" width="190" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="585.0" y="361.5" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">gps_track_channel x4</text>
<text x="585.0" y="376.5" font-size="9.5" text-anchor="middle" fill="#374151">EPB loop: NCOs, E/P/L/N,</text>
<text x="585.0" y="391.5" font-size="9.5" text-anchor="middle" fill="#374151">DLL + FLL, lock detector</text>
<text x="585.0" y="406.5" font-size="9.5" text-anchor="middle" fill="#374151">+ stock despread multiply</text>
<rect x="720" y="340" width="150" height="80" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="795.0" y="369.0" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">gps_cn0_meter</text>
<text x="795.0" y="384.0" font-size="9.5" text-anchor="middle" fill="#374151">(nested in each</text>
<text x="795.0" y="399.0" font-size="9.5" text-anchor="middle" fill="#374151">channel, stock)</text>
<rect x="910" y="335" width="230" height="90" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
<text x="1025.0" y="361.5" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">Displays</text>
<text x="1025.0" y="376.5" font-size="9.5" text-anchor="middle" fill="#374151">despread spectrum + waterfalls</text>
<text x="1025.0" y="391.5" font-size="9.5" text-anchor="middle" fill="#374151">P constellation, |E| |P| |L|,</text>
<text x="1025.0" y="406.5" font-size="9.5" text-anchor="middle" fill="#374151">DLL error, FLL freq, C/N0</text>
<path d="M450,250 L450,380 L488,380" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M680,380 L718,380" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<text x="684" y="372" font-size="10.5" fill="#374151">P, N</text>
<path d="M870,380 L908,380" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M970,196 L970,300 L600,300 L600,333" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#m)"/>
<text x="610" y="294" font-size="10.5" fill="#d97706">assign (which PRN, Doppler, code epoch)</text>
<rect x="470" y="470" width="690" height="150" rx="10" fill="#ffffff" fill-opacity="0.45" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="480" y="488" font-size="12" font-weight="bold" fill="#94a3b8">NAVIGATION DATA: bits -&gt; subframes -&gt; GPS time (x4 channels)</text>
<rect x="490" y="505" width="190" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="585.0" y="531.5" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">gps_nav_bits x4</text>
<text x="585.0" y="546.5" font-size="9.5" text-anchor="middle" fill="#374151">bit sync (argmax of 20)</text>
<text x="585.0" y="561.5" font-size="9.5" text-anchor="middle" fill="#374151">differential detection</text>
<text x="585.0" y="576.5" font-size="9.5" text-anchor="middle" fill="#374151">preamble taggers</text>
<rect x="720" y="510" width="150" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="795.0" y="539.0" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">Nav decoder</text>
<text x="795.0" y="554.0" font-size="9.5" text-anchor="middle" fill="#374151">parity, frame sync,</text>
<text x="795.0" y="569.0" font-size="9.5" text-anchor="middle" fill="#374151">TOW, week -&gt; UTC</text>
<rect x="910" y="505" width="230" height="90" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
<text x="1025.0" y="539.0" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">Navigation tab</text>
<text x="1025.0" y="554.0" font-size="9.5" text-anchor="middle" fill="#374151">bit-sync curves, cos(dphi),</text>
<text x="1025.0" y="569.0" font-size="9.5" text-anchor="middle" fill="#374151">tagged bits, last decoded line</text>
<path d="M585,425 L585,503" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<text x="592" y="470" font-size="10.5" fill="#374151">P (1 kHz)</text>
<path d="M680,550 L718,550" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<text x="686" y="542" font-size="10.5" fill="#374151">bits</text>
<path d="M870,550 L908,550" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<text x="20" y="210" font-size="12.0" fill="#111827" text-anchor="start" font-weight="bold">Rule of the house:</text>
<text x="20" y="232" font-size="11.5" fill="#374151" text-anchor="start">stock blocks wherever GNU Radio has one,</text>
<text x="20" y="250" font-size="11.5" fill="#374151" text-anchor="start">Embedded Python only for what it can't do:</text>
<text x="20" y="268" font-size="11.5" fill="#374151" text-anchor="start">- a search that changes on a schedule</text>
<text x="20" y="286" font-size="11.5" fill="#374151" text-anchor="start">- a decision across a 2-D grid</text>
<text x="20" y="304" font-size="11.5" fill="#374151" text-anchor="start">- a 1 ms closed loop (tracking)</text>
<text x="20" y="322" font-size="11.5" fill="#374151" text-anchor="start">- parity + frame sync (navigation)</text>
<text x="20" y="340" font-size="11.5" fill="#374151" text-anchor="start"></text>
<text x="20" y="358" font-size="11.5" fill="#374151" text-anchor="start">Everything a stock block does is a</text>
<text x="20" y="376" font-size="11.5" fill="#374151" text-anchor="start">signal you can probe with a QT sink.</text>
</svg>