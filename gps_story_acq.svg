<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="DejaVu Sans, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1180" height="560" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#111827">Inside gps_acq_branch: a correlation at all 2048 code phases at once</text>
<rect x="20" y="55" width="1140" height="200" rx="10" fill="#ecfdf5" fill-opacity="0.45" stroke="#059669" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="30" y="73" font-size="12" font-weight="bold" fill="#059669">gps_acq_branch (hier block, all stock)</text>
<rect x="40" y="120" width="110" height="60" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="95.0" y="146.5" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">Signal Source</text>
<text x="95.0" y="161.5" font-size="9.5" text-anchor="middle" fill="#374151">f_off: 0 or -500 Hz</text>
<rect x="175" y="120" width="90" height="60" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="220.0" y="146.5" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">Multiply</text>
<text x="220.0" y="161.5" font-size="9.5" text-anchor="middle" fill="#374151">x e^(j2pi f t)</text>
<rect x="290" y="120" width="110" height="60" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="345.0" y="146.5" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">Stream to</text>
<text x="345.0" y="161.5" font-size="9.5" text-anchor="middle" fill="#374151">Vector (2048)</text>
<rect x="425" y="120" width="90" height="60" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="470.0" y="139.0" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">FFT</text>
<text x="470.0" y="154.0" font-size="9.5" text-anchor="middle" fill="#374151">forward, no</text>
<text x="470.0" y="169.0" font-size="9.5" text-anchor="middle" fill="#374151">window</text>
<rect x="540" y="120" width="110" height="60" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="595.0" y="146.5" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">Multiply</text>
<text x="595.0" y="161.5" font-size="9.5" text-anchor="middle" fill="#374151">X(k) * taps(k)</text>
<rect x="675" y="120" width="90" height="60" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="720.0" y="146.5" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">FFT</text>
<text x="720.0" y="161.5" font-size="9.5" text-anchor="middle" fill="#374151">reverse</text>
<rect x="790" y="120" width="100" height="60" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="840.0" y="146.5" font-size="11.0" font-weight="bold" text-anchor="middle" fill="#111827">Mag^2</text>
<text x="840.0" y="161.5" font-size="9.5" text-anchor="middle" fill="#374151">|corr|^2</text>
<rect x="915" y="90" width="110" height="50" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="970.0" y="111.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111827">x 1/N^3</text>
<text x="970.0" y="126.5" font-size="9.0" text-anchor="middle" fill="#374151">1 ms probe</text>
<rect x="915" y="170" width="110" height="60" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="970.0" y="189.0" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111827">Integrate</text>
<text x="970.0" y="204.0" font-size="9.0" text-anchor="middle" fill="#374151">20 vectors</text>
<text x="970.0" y="219.0" font-size="9.0" text-anchor="middle" fill="#374151">+ x 1/20</text>
<path d="M150,150 L173,150" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M265,150 L288,150" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M400,150 L423,150" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M515,150 L538,150" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M650,150 L673,150" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M765,150 L788,150" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M890,140 L913,118" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M890,160 L913,195" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M1025,115 L1140,115" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<text x="1040" y="108" font-size="10.5" fill="#374151">corr_1ms</text>
<path d="M1025,200 L1140,200" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<text x="1040" y="193" font-size="10.5" fill="#374151">corr_20ms</text>
<path d="M220,85 L220,118" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<text x="226" y="82" font-size="10.5" fill="#374151">iq (2.048 MS/s)</text>
<rect x="470" y="300" width="250" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="595.0" y="329.0" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">Taps scheduler (EPB)</text>
<text x="595.0" y="344.0" font-size="10.0" text-anchor="middle" fill="#374151">taps = roll(conj(FFT(code_prn)), m)</text>
<text x="595.0" y="359.0" font-size="10.0" text-anchor="middle" fill="#374151">changes only on 20 ms boundaries</text>
<path d="M595,300 L595,182" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<text x="602" y="270" font-size="10.5" fill="#374151">taps (vector, 1 per ms)</text>
<rect x="790" y="300" width="250" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="915.0" y="329.0" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111827">Decider (EPB)</text>
<text x="915.0" y="344.0" font-size="10.0" text-anchor="middle" fill="#374151">42 rows x 2048 phases per PRN</text>
<text x="915.0" y="359.0" font-size="10.0" text-anchor="middle" fill="#374151">peak/mean &gt; 3.5 and dof &gt; 5</text>
<path d="M1100,200 L1100,340 L1042,340" fill="none" stroke="#374151" stroke-width="1.6"  marker-end="url(#a)"/>
<path d="M720,340 L788,340" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#m)"/>
<text x="722" y="394" font-size="10.5" fill="#d97706">tag 'acq'=(prn, m) rides along</text>
<rect x="20" y="410" width="1140" height="135" rx="10" fill="#fffbeb" fill-opacity="0.45" stroke="#d97706" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="30" y="428" font-size="12" font-weight="bold" fill="#d97706">Why rolling the code spectrum = testing a Doppler</text>
<text x="40" y="455" font-size="12.0" fill="#374151" text-anchor="start">At 2.048 MS/s a 2048-point FFT has bins exactly 1 kHz apart. Shifting the signal by m kHz just slides its spectrum by m bins:</text>
<text x="40" y="476" font-size="13.0" fill="#111827" text-anchor="start" font-weight="bold">        |IFFT( FFT(x * e^(-j2pi m n/N)) * C* )|  =  |IFFT( FFT(x) * roll(C*, m) )|</text>
<text x="40" y="497" font-size="12.0" fill="#374151" text-anchor="start">So instead of retuning an oscillator for every Doppler bin, I roll the replica spectrum. The half-kHz bins come from a second branch</text>
<text x="40" y="518" font-size="12.0" fill="#374151" text-anchor="start">that is pre-mixed by a fixed -500 Hz. Two branches x 21 rolls = 42 Doppler bins from -10 to +10.5 kHz, 20 ms each, ~0.42 s per PRN.</text>
</svg>