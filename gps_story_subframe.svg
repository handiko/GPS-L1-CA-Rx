<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="DejaVu Sans, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1180" height="470" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#111827">The LNAV message the decoder is chasing (IS-GPS-200)</text>
<text x="40" y="70" font-size="12.5" fill="#111827" text-anchor="start" font-weight="bold">Frame = 5 subframes = 30 s. Each subframe = 10 words = 300 bits = 6 s at 50 bit/s.</text>
<rect x="40" y="85" width="214" height="40" fill="#dbeafe" stroke="#64748b"/>
<text x="147" y="110" font-size="11.5" fill="#111827" text-anchor="middle">SF1: clock, week, health</text>
<rect x="260" y="85" width="214" height="40" fill="#dcfce7" stroke="#64748b"/>
<text x="367" y="110" font-size="11.5" fill="#111827" text-anchor="middle">SF2: ephemeris I</text>
<rect x="480" y="85" width="214" height="40" fill="#fef9c3" stroke="#64748b"/>
<text x="587" y="110" font-size="11.5" fill="#111827" text-anchor="middle">SF3: ephemeris II</text>
<rect x="700" y="85" width="214" height="40" fill="#fde68a" stroke="#64748b"/>
<text x="807" y="110" font-size="11.5" fill="#111827" text-anchor="middle">SF4: almanac, iono, UTC</text>
<rect x="920" y="85" width="214" height="40" fill="#fecaca" stroke="#64748b"/>
<text x="1027" y="110" font-size="11.5" fill="#111827" text-anchor="middle">SF5: almanac</text>
<text x="40" y="170" font-size="12.5" fill="#111827" text-anchor="start" font-weight="bold">One subframe: 10 words of 30 bits (24 data + 6 parity)</text>
<rect x="40" y="185" width="106" height="36" fill="#fde68a" stroke="#64748b"/>
<text x="93" y="208" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="bold">TLM</text>
<rect x="150" y="185" width="106" height="36" fill="#fde68a" stroke="#64748b"/>
<text x="203" y="208" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="bold">HOW</text>
<rect x="260" y="185" width="106" height="36" fill="#f1f5f9" stroke="#64748b"/>
<text x="313" y="208" font-size="11.5" fill="#111827" text-anchor="middle">word 3</text>
<rect x="370" y="185" width="106" height="36" fill="#f1f5f9" stroke="#64748b"/>
<text x="423" y="208" font-size="11.5" fill="#111827" text-anchor="middle">word 4</text>
<rect x="480" y="185" width="106" height="36" fill="#f1f5f9" stroke="#64748b"/>
<text x="533" y="208" font-size="11.5" fill="#111827" text-anchor="middle">word 5</text>
<rect x="590" y="185" width="106" height="36" fill="#f1f5f9" stroke="#64748b"/>
<text x="643" y="208" font-size="11.5" fill="#111827" text-anchor="middle">word 6</text>
<rect x="700" y="185" width="106" height="36" fill="#f1f5f9" stroke="#64748b"/>
<text x="753" y="208" font-size="11.5" fill="#111827" text-anchor="middle">word 7</text>
<rect x="810" y="185" width="106" height="36" fill="#f1f5f9" stroke="#64748b"/>
<text x="863" y="208" font-size="11.5" fill="#111827" text-anchor="middle">word 8</text>
<rect x="920" y="185" width="106" height="36" fill="#f1f5f9" stroke="#64748b"/>
<text x="973" y="208" font-size="11.5" fill="#111827" text-anchor="middle">word 9</text>
<rect x="1030" y="185" width="106" height="36" fill="#f1f5f9" stroke="#64748b"/>
<text x="1083" y="208" font-size="11.5" fill="#111827" text-anchor="middle">word 10</text>
<text x="40" y="265" font-size="12.5" fill="#111827" text-anchor="start" font-weight="bold">The two words I decode first:</text>
<text x="40" y="303" font-size="12.0" fill="#111827" text-anchor="start" font-weight="bold">TLM</text>
<rect x="110" y="280" width="272" height="34" fill="#fecaca" stroke="#64748b"/>
<text x="246" y="301" font-size="10.5" fill="#111827" text-anchor="middle">preamble 10001011</text>
<rect x="382" y="280" width="476" height="34" fill="#f1f5f9" stroke="#64748b"/>
<text x="620" y="301" font-size="10.5" fill="#111827" text-anchor="middle">TLM message (14)</text>
<rect x="858" y="280" width="68" height="34" fill="#f1f5f9" stroke="#64748b"/>
<text x="892" y="301" font-size="10.5" fill="#111827" text-anchor="middle">2</text>
<rect x="926" y="280" width="204" height="34" fill="#e0e7ff" stroke="#64748b"/>
<text x="1028" y="301" font-size="10.5" fill="#111827" text-anchor="middle">parity (6)</text>
<text x="40" y="353" font-size="12.0" fill="#111827" text-anchor="start" font-weight="bold">HOW</text>
<rect x="110" y="330" width="578" height="34" fill="#dcfce7" stroke="#64748b"/>
<text x="399" y="351" font-size="10.5" fill="#111827" text-anchor="middle">TOW count (17): time of week of the NEXT subframe, x 6 s</text>
<rect x="688" y="330" width="68" height="34" fill="#f1f5f9" stroke="#64748b"/>
<text x="722" y="351" font-size="10.5" fill="#111827" text-anchor="middle">alert, AS</text>
<rect x="756" y="330" width="102" height="34" fill="#fef9c3" stroke="#64748b"/>
<text x="807" y="351" font-size="10.5" fill="#111827" text-anchor="middle">SF ID (3)</text>
<rect x="858" y="330" width="68" height="34" fill="#f1f5f9" stroke="#64748b"/>
<text x="892" y="351" font-size="10.5" fill="#111827" text-anchor="middle">t (2)</text>
<rect x="926" y="330" width="204" height="34" fill="#e0e7ff" stroke="#64748b"/>
<text x="1028" y="351" font-size="10.5" fill="#111827" text-anchor="middle">parity (6)</text>
<text x="40" y="400" font-size="11.5" fill="#374151" text-anchor="start">Parity of every word also uses D29*, D30*: the last two bits of the previous word. If D30* = 1, the 24 data bits were sent inverted.</text>
<text x="40" y="418" font-size="11.5" fill="#374151" text-anchor="start">That chaining is what lets a receiver survive a polarity slip: only the word containing the slip fails. Subframe 1 word 3 starts with the 10-bit week number.</text>
</svg>